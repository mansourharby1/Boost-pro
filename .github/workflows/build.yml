name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Prepare project
        run: |
          if [ ! -f settings.gradle ]; then
            ZIP=$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | head -n1)
            if [ -z "$ZIP" ]; then
              echo "لا يوجد settings.gradle ولا ملف zip في الريبو"
              ls -la
              exit 1
            fi
            echo "Unzipping $ZIP"
            mkdir -p /tmp/proj
            unzip -q -o "$ZIP" -d /tmp/proj
            cp -r /tmp/proj/. .
          fi
          ls -la

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BoosterPro-debug-apk
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
