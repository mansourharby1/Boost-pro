name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: |
          FILE=$(find . -name settings.gradle -not -path './.git/*' | head -n1)
          if [ -z "$FILE" ]; then
            echo "settings.gradle غير موجود في الريبو - ارفع ملفات المشروع كاملة"
            ls -la
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Project dir: $DIR"
          cd "$DIR"
          gradle assembleDebug --no-daemon --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BoosterPro-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
